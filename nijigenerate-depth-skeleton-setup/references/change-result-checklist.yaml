    target: "independent following when requested"
    expected: "World pitch axis follows the intended yaw frame; head/torso source weights transition continuously without a threshold seam."
  - id: depth-skeleton-setup-change-002
    target: "parameter links"
    expected: "Explicit source/destination axes and signs match the requested behavior with no duplicate driver, cycle or unintended Roll inheritance."
