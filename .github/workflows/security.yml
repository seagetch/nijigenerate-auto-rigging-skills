name: Security regression checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  review-tools:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        app:
          - nijigenerate-checklist-review-loop/scripts/checklist-reviewer
          - nijigenerate-work-review-tool/scripts/review-viewer-template
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
        working-directory: ${{ matrix.app }}
      - run: npm test
        working-directory: ${{ matrix.app }}
      - run: npm run build
        working-directory: ${{ matrix.app }}
      - run: npm audit --audit-level=low
        working-directory: ${{ matrix.app }}
  privacy-and-installers:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: python3 -m unittest discover -s tests -v
      - run: python3 tools/security_check.py
